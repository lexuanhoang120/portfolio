<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xuan Hoang Le | AI Researcher & Data Scientist</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <nav class="container">
      <a class="logo" href="#top">Xuan Hoang Le</a>
      <div class="nav-links"></div>
    </nav>
  </header>

  <main id="top">
    <div class="container hero">
      <div>
        <div class="eyebrow hero-eyebrow"></div>
        <h1 class="hero-heading"></h1>
        <p class="hero-description"></p>
        <div class="hero-highlights"></div>
        <div class="actions hero-actions"></div>
      </div>

      <aside class="profile-card">
        <div class="profile-photo">
          <img src="images/myphoto.jpg" alt="Portrait of Xuan Hoang Le" />
        </div>
        <h2>Xuan Hoang Le</h2>
        <div class="profile-list"></div>
      </aside>
    </div>

    <section id="about">
      <div class="container">
        <h2 class="section-title">About</h2>
        <p class="section-subtitle"></p>
        <div class="grid"></div>
      </div>
    </section>

    <section id="research">
      <div class="container">
        <h2 class="section-title">Research Focus</h2>
        <p class="section-subtitle"></p>
        <div class="project-grid"></div>
      </div>
    </section>

    <section id="projects">
      <div class="container">
        <h2 class="section-title">Featured Projects</h2>
        <p class="section-subtitle"></p>
        <div class="project-grid"></div>
      </div>
    </section>

    <section id="experience">
      <div class="container">
        <h2 class="section-title">Experience</h2>
        <div class="timeline"></div>
      </div>
    </section>

    <section id="manuscripts">
      <div class="container">
        <h2 class="section-title">Research Manuscripts</h2>
        <p class="section-subtitle"></p>
        <div class="project-grid manuscript-grid"></div>
      </div>
    </section>

    <section id="cv">
      <div class="container">
        <h2 class="section-title">CV</h2>
        <p class="section-subtitle"></p>
        <div class="cv-panel">
          <div class="cv-summary"></div>
          <div class="cv-actions actions"></div>
        </div>
      </div>
    </section>

    <section id="education">
      <div class="container">
        <h2 class="section-title">Education</h2>
        <div class="education-list"></div>
      </div>
    </section>

    <section id="skills">
      <div class="container">
        <h2 class="section-title">Skills</h2>
        <div class="skills"></div>
      </div>
    </section>

    <section id="credentials">
      <div class="container">
        <h2 class="section-title">Credentials</h2>
        <p class="section-subtitle"></p>
        <div class="grid"></div>
      </div>
    </section>

    <section id="contact">
      <div class="container">
        <h2 class="section-title">Contact</h2>
        <p class="section-subtitle"></p>
        <div class="actions"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
